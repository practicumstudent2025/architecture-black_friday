name: sharding-repl-cache

services:
  # Config Server (для метаданных шардирования)
  config1:
    container_name: config1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet configReplSet --port 27017 --bind_ip_all
    volumes:
      - config1_data:/data/db
    networks:
      - mongo-network

  # MongoDB Router (mongos)
  mongos:
    container_name: mongos
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb configReplSet/config1:27017 --port 27017 --bind_ip_all
    depends_on:
      - config1
    ports:
      - "27017:27017"
    networks:
      - mongo-network

  # Shard 1 - Primary
  shard1-primary:
    container_name: shard1-primary
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard1_primary_data:/data/db
    networks:
      - mongo-network

  # Shard 1 - Secondary 1
  shard1-secondary1:
    container_name: shard1-secondary1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard1_secondary1_data:/data/db
    networks:
      - mongo-network

  # Shard 1 - Secondary 2
  shard1-secondary2:
    container_name: shard1-secondary2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard1_secondary2_data:/data/db
    networks:
      - mongo-network

  # Shard 2 - Primary
  shard2-primary:
    container_name: shard2-primary
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard2_primary_data:/data/db
    networks:
      - mongo-network

  # Shard 2 - Secondary 1
  shard2-secondary1:
    container_name: shard2-secondary1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard2_secondary1_data:/data/db
    networks:
      - mongo-network

  # Shard 2 - Secondary 2
  shard2-secondary2:
    container_name: shard2-secondary2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27017 --bind_ip_all
    volumes:
      - shard2_secondary2_data:/data/db
    networks:
      - mongo-network

  # Redis Cache
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mongo-network

  # FastAPI Application
  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
      - redis
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"
    networks:
      - mongo-network

volumes:
  config1_data:
  shard1_primary_data:
  shard1_secondary1_data:
  shard1_secondary2_data:
  shard2_primary_data:
  shard2_secondary1_data:
  shard2_secondary2_data:
  redis_data:

networks:
  mongo-network:
    driver: bridge